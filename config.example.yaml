# WordPress Export JSON Configuration

# WordPress site URL (required)
url: "https://example.com"

# Output directory or file path
# If not specified, defaults to: export/{domain-name}.{date}{time}
# For JSON format: specify a .json file or directory
# For Markdown format: specify a directory
# output: "./export"

# Export format: json, markdown, ssg, shopify, magento, and others
# - json: Exports all content as a single JSON file
# - markdown: Exports posts/pages as individual markdown files
# - ssg: Static site generator content source - pages nested to mirror their URL,
#        single-spelled front matter, root-relative addresses, cleaned body HTML
# - shopify: Exports to Shopify-compatible CSV format for product import
# - magento: Exports to Magento 2-compatible CSV format for product import
format: "json"

# Enable brute force ID discovery to find unlisted content
brute_force: false

# Maximum ID to check during brute force scanning
max_id: 10000

# Download media files (images, videos, etc.)
download_media: true

# Download only featured images and images embedded in content
# (only applies when download_media is true)
relevant_media_only: false

# Form of rewritten media paths in exported content (json/markdown formats)
# - root:     "/media/images/123_photo.jpg" - resolves from any URL depth (default)
# - relative: "media/images/123_photo.jpg"  - only correct at the site root
media_path_style: "root"

# Form of the address fields link / canonical_url / hreflangs (json/markdown formats)
# - absolute: "https://example.com/2010/07/21/389/" - keeps the source URL (default)
# - root:     "/2010/07/21/389/"                    - for rebuilding at the same paths
# Only same-host addresses are converted; foreign hosts are left untouched.
link_style: "absolute"

# Preserve original WordPress URLs instead of rewriting them to local paths
keep_original_urls: false

# Write a11y-report.md flagging WCAG 2.2 contrast (SC 1.4.3) and missing alt text
# (SC 1.1.1). The export itself is unchanged.
report_a11y: false

# Which meta tags to keep beyond the named SEO fields (requires assisted_crawl):
# - all:  every meta tag lands in the `meta` map (default - plugins put real
#         information in tags nobody anticipated, and a dropped tag is unrecoverable)
# - none: only the named SEO fields
# - a comma-separated allow-list, e.g. "twitter:card,article:author"
extract_meta: "all"

# Number of concurrent downloads
concurrent: 5

# HTTP request timeout in seconds
timeout: 30

# Number of retries for failed requests
retries: 3

# User agent string for HTTP requests
user_agent: "WordPress-Export-JSON/1.0"

# Enable verbose output
verbose: false

# Filter posts/pages by URL path pattern (e.g., /fr/arts/)
# Only posts/pages with matching paths will be exported
# path_filter: "/fr/arts/"

# Crawl actual URLs to extract SEO metadata (title, description, og tags)
# Useful for extracting RankMath/Yoast SEO data not exposed via REST API
assisted_crawl: false
