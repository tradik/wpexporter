name: CI/CD Pipeline

# Documentation and the documentation site compile nothing, so they must not run
# tests, lint, gosec, the release, the Docker push or the Homebrew update. These
# paths belong to docs-site.yml, which owns the same list from the other side —
# keep the two in step when either changes.
#
# paths-ignore skips a run only when *every* changed file matches, so a commit
# that touches Go code and a guide together still runs the full pipeline.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "templates/**"
      - "assets/**"
      - "man/**"
      - "docs-site.yaml"
      - ".github/workflows/docs-site.yml"
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "templates/**"
      - "assets/**"
      - "man/**"
      - "docs-site.yaml"
      - ".github/workflows/docs-site.yml"
      - "**.md"
      - "LICENSE"

# Least privilege by default: jobs only read the repo. Jobs that publish request
# the narrower write scope they need explicitly (OPS-002).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned rather than "stable": a tool that parses untrusted HTML,
          # JSON and archive input all day should move toolchain on a decision,
          # not on whatever the runner cached. 1.27 also rewrote encoding/json
          # on the v2 implementation, which is most of this program's work.
          go-version: "1.27.1"
          cache: true

      - name: Set Go environment variables
        run: |
          go env -w GOPRIVATE=github.com/tradik/*
          go env -w GONOSUMDB=github.com/tradik/*
          go env -w GOPROXY=https://proxy.golang.org,direct

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned rather than "stable": a tool that parses untrusted HTML,
          # JSON and archive input all day should move toolchain on a decision,
          # not on whatever the runner cached. 1.27 also rewrote encoding/json
          # on the v2 implementation, which is most of this program's work.
          go-version: "1.27.1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  security:
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the repo. A read-only token limits the
    # blast radius of any compromised action step (OPS-001).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned rather than "stable": a tool that parses untrusted HTML,
          # JSON and archive input all day should move toolchain on a decision,
          # not on whatever the runner cached. 1.27 also rewrote encoding/json
          # on the v2 implementation, which is most of this program's work.
          go-version: "1.27.1"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # gosec is a pinned tool dependency of the tools/ module, so it is built
      # from tools/go.mod with every transitive version fixed by tools/go.sum:
      # the scanner that passes today cannot silently become a different one
      # tomorrow. `go install pkg@version` pins only the tool itself and
      # re-resolves everything under it outside any lock file
      # (SonarSource githubactions:S8545), and the mutable @master action ref
      # (OPS-001) and the stale bundled Docker image are avoided the same way.
      # The tools module is separate so gosec's dependency tree — gRPC,
      # OpenTelemetry and the rest — stays out of wpexporter's own.
      - name: Build gosec (versions locked by tools/go.sum)
        run: go -C tools build -o "${RUNNER_TEMP}/gosec" github.com/securego/gosec/v2/cmd/gosec

      - name: Run Gosec Security Scanner
        # G703: Path traversal - expected as tool saves to user-specified paths
        # G704: SSRF - expected as tool makes requests to user-provided WordPress URLs
        # G117: Secret patterns - auth tokens are intentionally configurable
        # G122: filepath.Walk TOCTOU - acceptable for zip archive creation
        run: |
          "${RUNNER_TEMP}/gosec" -exclude=G703,G704,G117,G122 ./...

  # The version this run will release, read once from the VERSION file and used by
  # both build and release.
  #
  # It used to be derived by incrementing the latest tag, which had two problems:
  # it could only ever produce a patch bump (so a minor release was impossible),
  # and `build` ran before the tag existed, so `git describe` in the Makefile
  # stamped binaries with the PREVIOUS tag plus a commit count -- v1.7.9 shipped
  # binaries reporting v1.7.8-7-g414285b. The version is now an explicit,
  # reviewable line in the diff.
  version:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.next_version.outputs.next_version }}
      already_released: ${{ steps.next_version.outputs.already_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read release version
        id: next_version
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          RAW=$(tr -d '[:space:]' < VERSION)
          if ! echo "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$RAW'"
            exit 1
          fi

          NEW_VERSION="v${RAW}"
          echo "next_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # A tag that already exists means the VERSION bump was forgotten. Say so
          # rather than failing later inside the release step.
          if git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; then
            echo "already_released=true" >> $GITHUB_OUTPUT
            echo "::warning::Tag ${NEW_VERSION} already exists - release will be skipped. Bump the VERSION file."
          else
            echo "already_released=false" >> $GITHUB_OUTPUT
          fi

          echo "Release version: $NEW_VERSION"

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security, version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned rather than "stable": a tool that parses untrusted HTML,
          # JSON and archive input all day should move toolchain on a decision,
          # not on whatever the runner cached. 1.27 also rewrote encoding/json
          # on the v2 implementation, which is most of this program's work.
          go-version: "1.27.1"

      # VERSION is passed explicitly so the binaries carry the tag this run will
      # create. A command-line variable overrides the Makefile's `git describe`
      # fallback, which cannot see a tag that does not exist yet.
      - name: Build for multiple platforms
        run: make release VERSION=${{ needs.version.outputs.next_version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [build, version]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.version.outputs.already_released == 'false'
    permissions:
      contents: write # create tags and GitHub releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned rather than "stable": a tool that parses untrusted HTML,
          # JSON and archive input all day should move toolchain on a decision,
          # not on whatever the runner cached. 1.27 also rewrote encoding/json
          # on the v2 implementation, which is most of this program's work.
          go-version: "1.27.1"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist/

      # upload-artifact zips internally and does not preserve the executable bit,
      # so binaries come back from the round-trip as 0644 and were shipped that
      # way — anyone extracting a release tarball had to chmod +x by hand before
      # the binary would run. Homebrew and Snap masked this by setting the mode
      # themselves on install.
      - name: Restore executable bit on binaries
        run: chmod +x dist/wpexportjson-* dist/wpxmlrpc-* dist/wpmcp-* dist/wpexporter-*

      - name: Create release packages
        run: |
          mkdir -p dist/packages
          VERSION="${{ needs.version.outputs.next_version }}"
          
          # Create tar.gz packages for each platform
          for os in linux freebsd darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              
              if [ -f "dist/wpexportjson-${os}-${arch}${ext}" ]; then
                # Create package directory
                PKG_DIR="dist/pkg-${os}-${arch}"
                mkdir -p "$PKG_DIR"

                # Copy binaries
                cp "dist/wpexportjson-${os}-${arch}${ext}" "$PKG_DIR/wpexportjson${ext}"
                cp "dist/wpxmlrpc-${os}-${arch}${ext}" "$PKG_DIR/wpxmlrpc${ext}"
                cp "dist/wpmcp-${os}-${arch}${ext}" "$PKG_DIR/wpmcp${ext}" 2>/dev/null || true
                cp "dist/wpexporter-${os}-${arch}${ext}" "$PKG_DIR/wpexporter${ext}" 2>/dev/null || true

                # Copy docs and man pages
                cp README.md "$PKG_DIR/" 2>/dev/null || true
                cp CHANGELOG.md "$PKG_DIR/" 2>/dev/null || true
                cp config.example.yaml "$PKG_DIR/" 2>/dev/null || true
                mkdir -p "$PKG_DIR/man"
                cp man/*.1 "$PKG_DIR/man/" 2>/dev/null || true
                
                # Create archive
                if [ "$os" = "windows" ]; then
                  (cd "$PKG_DIR" && zip -r "../packages/wpexportjson-${VERSION}-${os}-${arch}.zip" .)
                else
                  tar -czf "dist/packages/wpexportjson-${VERSION}-${os}-${arch}.tar.gz" -C "$PKG_DIR" .
                fi
                
                # Cleanup
                rm -rf "$PKG_DIR"
              fi
            done
          done
          
          # Create checksums
          (cd dist/packages && sha256sum * > checksums.txt)
          
          echo "Created packages:"
          ls -la dist/packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.next_version }}
          name: Release ${{ needs.version.outputs.next_version }}
          body: |
            ## What's Changed
            
            Auto-generated release from commit ${{ github.sha }}
            
            ### Downloads
            
            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | AMD64 | `wpexportjson-${{ needs.version.outputs.next_version }}-linux-amd64.tar.gz` |
            | Linux | ARM64 | `wpexportjson-${{ needs.version.outputs.next_version }}-linux-arm64.tar.gz` |
            | macOS | AMD64 | `wpexportjson-${{ needs.version.outputs.next_version }}-darwin-amd64.tar.gz` |
            | macOS | ARM64 | `wpexportjson-${{ needs.version.outputs.next_version }}-darwin-arm64.tar.gz` |
            | Windows | AMD64 | `wpexportjson-${{ needs.version.outputs.next_version }}-windows-amd64.zip` |
            | Windows | ARM64 | `wpexportjson-${{ needs.version.outputs.next_version }}-windows-arm64.zip` |
            | FreeBSD | AMD64 | `wpexportjson-${{ needs.version.outputs.next_version }}-freebsd-amd64.tar.gz` |
            | FreeBSD | ARM64 | `wpexportjson-${{ needs.version.outputs.next_version }}-freebsd-arm64.tar.gz` |
            
            ### Installation

            ```bash
            # Homebrew (macOS / Linux)
            brew install tradik/tap/wpexporter

            # Snap (Linux)
            sudo snap install wpexporter

            # Manual (Linux/macOS)
            tar -xzf wpexportjson-${{ needs.version.outputs.next_version }}-<os>-<arch>.tar.gz
            chmod +x wpexportjson wpxmlrpc wpmcp
            sudo mv wpexportjson wpxmlrpc wpmcp /usr/local/bin/

            # Windows
            # Extract the zip and add to PATH
            ```
          files: dist/packages/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homebrew:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read # tap is updated via HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        run: |
          VERSION=$(git tag --sort=-v:refname | head -n1)
          VERSION=${VERSION:-v1.0.0}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download release tarballs and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/tradik/wpexporter/releases/download/${VERSION}"

          for pair in "darwin-amd64:DARWIN_AMD64" "darwin-arm64:DARWIN_ARM64" \
                      "linux-amd64:LINUX_AMD64" "linux-arm64:LINUX_ARM64"; do
            PLATFORM="${pair%%:*}"
            VAR="${pair##*:}"
            URL="${BASE}/wpexportjson-${VERSION}-${PLATFORM}.tar.gz"
            echo "Downloading ${URL}..."
            SHA=$(curl -sL "${URL}" | sha256sum | awk '{print $1}')
            echo "sha_${VAR}=${SHA}" >> $GITHUB_OUTPUT
            echo "${VAR}: ${SHA}"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tradik/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"

          cat > homebrew-tap/Formula/wpexporter.rb << 'FORMULA_EOF'
          # Homebrew formula for wpexporter - WordPress Export Tools
          # Install: brew install tradik/tap/wpexporter
          # Or: brew tap tradik/tap && brew install wpexporter

          class Wpexporter < Formula
            desc "Export WordPress content to JSON, Markdown, Shopify, and 14+ formats"
            homepage "https://github.com/tradik/wpexporter"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_arm do
                url "URL_DARWIN_ARM64"
                sha256 "SHA_DARWIN_ARM64"
              end
              on_intel do
                url "URL_DARWIN_AMD64"
                sha256 "SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              on_arm do
                url "URL_LINUX_ARM64"
                sha256 "SHA_LINUX_ARM64"
              end
              on_intel do
                url "URL_LINUX_AMD64"
                sha256 "SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "wpexportjson"
              bin.install "wpxmlrpc"
              bin.install "wpmcp"
              bin.install "wpexporter"
              man1.install "man/wpexportjson.1" if File.exist? "man/wpexportjson.1"
            end

            test do
              system "#{bin}/wpexporter", "--help"
              system "#{bin}/wpexportjson", "--help"
              system "#{bin}/wpxmlrpc", "--help"
            end
          end
          FORMULA_EOF

          BASE_URL="https://github.com/tradik/wpexporter/releases/download/${VERSION}"

          sed -i "s|VERSION_PLACEHOLDER|${VERSION_NUM}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_DARWIN_ARM64|${BASE_URL}/wpexportjson-${VERSION}-darwin-arm64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_DARWIN_AMD64|${BASE_URL}/wpexportjson-${VERSION}-darwin-amd64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_LINUX_ARM64|${BASE_URL}/wpexportjson-${VERSION}-linux-arm64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_LINUX_AMD64|${BASE_URL}/wpexportjson-${VERSION}-linux-amd64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_DARWIN_ARM64|${{ steps.sha.outputs.sha_DARWIN_ARM64 }}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_DARWIN_AMD64|${{ steps.sha.outputs.sha_DARWIN_AMD64 }}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_LINUX_ARM64|${{ steps.sha.outputs.sha_LINUX_ARM64 }}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_LINUX_AMD64|${{ steps.sha.outputs.sha_LINUX_AMD64 }}|g" homebrew-tap/Formula/wpexporter.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/wpexporter.rb

      - name: Push updated formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wpexporter.rb
          git diff --cached --quiet && exit 0
          git commit -m "feat: Update wpexporter to ${{ steps.version.outputs.version }}"
          git push

  snap:
    name: Snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read # published via SNAP_STORE_TOKEN
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update snap version
        run: |
          VERSION=$(git tag --sort=-v:refname | head -n1)
          VERSION=${VERSION:-v1.0.0}
          VERSION_NUM="${VERSION#v}"
          sed -i "s/^version:.*/version: \"${VERSION_NUM}\"/" snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: build

      - name: Upload snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap-package-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

      - name: Publish to Snap Store
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
