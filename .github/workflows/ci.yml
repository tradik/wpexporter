name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Set Go environment variables
        run: |
          go env -w GOPRIVATE=github.com/tradik/*
          go env -w GONOSUMDB=github.com/tradik/*
          go env -w GOPROXY=https://proxy.golang.org,direct

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          # G703: Path traversal - expected as tool saves to user-specified paths
          # G704: SSRF - expected as tool makes requests to user-provided WordPress URLs
          # G117: Secret patterns - auth tokens are intentionally configurable
          # G122: filepath.Walk TOCTOU - acceptable for zip archive creation
          args: "-exclude=G703,G704,G117,G122 ./..."

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build for multiple platforms
        run: make release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: dist/
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Calculate next version
        id: next_version
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          # Remove 'v' prefix if present
          VERSION="${LATEST_TAG#v}"
          
          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Default to 1.0.0 if no valid version found
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            # Increment patch version
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Create release packages
        run: |
          mkdir -p dist/packages
          VERSION="${{ steps.next_version.outputs.new_version }}"
          
          # Create tar.gz packages for each platform
          for os in linux freebsd darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              
              if [ -f "dist/wpexportjson-${os}-${arch}${ext}" ]; then
                # Create package directory
                PKG_DIR="dist/pkg-${os}-${arch}"
                mkdir -p "$PKG_DIR"

                # Copy binaries
                cp "dist/wpexportjson-${os}-${arch}${ext}" "$PKG_DIR/wpexportjson${ext}"
                cp "dist/wpxmlrpc-${os}-${arch}${ext}" "$PKG_DIR/wpxmlrpc${ext}"
                cp "dist/wpmcp-${os}-${arch}${ext}" "$PKG_DIR/wpmcp${ext}" 2>/dev/null || true

                # Copy docs and man pages
                cp README.md "$PKG_DIR/" 2>/dev/null || true
                cp CHANGELOG.md "$PKG_DIR/" 2>/dev/null || true
                cp config.example.yaml "$PKG_DIR/" 2>/dev/null || true
                mkdir -p "$PKG_DIR/man"
                cp man/*.1 "$PKG_DIR/man/" 2>/dev/null || true
                
                # Create archive
                if [ "$os" = "windows" ]; then
                  (cd "$PKG_DIR" && zip -r "../packages/wpexportjson-${VERSION}-${os}-${arch}.zip" .)
                else
                  tar -czf "dist/packages/wpexportjson-${VERSION}-${os}-${arch}.tar.gz" -C "$PKG_DIR" .
                fi
                
                # Cleanup
                rm -rf "$PKG_DIR"
              fi
            done
          done
          
          # Create checksums
          (cd dist/packages && sha256sum * > checksums.txt)
          
          echo "Created packages:"
          ls -la dist/packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.new_version }}
          name: Release ${{ steps.next_version.outputs.new_version }}
          body: |
            ## What's Changed
            
            Auto-generated release from commit ${{ github.sha }}
            
            ### Downloads
            
            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | AMD64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-linux-amd64.tar.gz` |
            | Linux | ARM64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-linux-arm64.tar.gz` |
            | macOS | AMD64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-darwin-amd64.tar.gz` |
            | macOS | ARM64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-darwin-arm64.tar.gz` |
            | Windows | AMD64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-windows-amd64.zip` |
            | Windows | ARM64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-windows-arm64.zip` |
            | FreeBSD | AMD64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-freebsd-amd64.tar.gz` |
            | FreeBSD | ARM64 | `wpexportjson-${{ steps.next_version.outputs.new_version }}-freebsd-arm64.tar.gz` |
            
            ### Installation

            ```bash
            # Homebrew (macOS / Linux)
            brew install tradik/tap/wpexporter

            # Snap (Linux)
            sudo snap install wpexporter

            # Manual (Linux/macOS)
            tar -xzf wpexportjson-${{ steps.next_version.outputs.new_version }}-<os>-<arch>.tar.gz
            chmod +x wpexportjson wpxmlrpc wpmcp
            sudo mv wpexportjson wpxmlrpc wpmcp /usr/local/bin/

            # Windows
            # Extract the zip and add to PATH
            ```
          files: dist/packages/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homebrew:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download release tarballs and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/tradik/wpexporter/releases/download/${VERSION}"

          for pair in "darwin-amd64:DARWIN_AMD64" "darwin-arm64:DARWIN_ARM64" \
                      "linux-amd64:LINUX_AMD64" "linux-arm64:LINUX_ARM64"; do
            PLATFORM="${pair%%:*}"
            VAR="${pair##*:}"
            URL="${BASE}/wpexportjson-${VERSION}-${PLATFORM}.tar.gz"
            echo "Downloading ${URL}..."
            SHA=$(curl -sL "${URL}" | sha256sum | awk '{print $1}')
            echo "sha_${VAR}=${SHA}" >> $GITHUB_OUTPUT
            echo "${VAR}: ${SHA}"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: tradik/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"

          cat > homebrew-tap/Formula/wpexporter.rb << 'FORMULA_EOF'
          # Homebrew formula for wpexporter - WordPress Export Tools
          # Install: brew install tradik/tap/wpexporter
          # Or: brew tap tradik/tap && brew install wpexporter

          class Wpexporter < Formula
            desc "Export WordPress content to JSON, Markdown, Shopify, and 14+ formats"
            homepage "https://github.com/tradik/wpexporter"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_arm do
                url "URL_DARWIN_ARM64"
                sha256 "SHA_DARWIN_ARM64"
              end
              on_intel do
                url "URL_DARWIN_AMD64"
                sha256 "SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              on_arm do
                url "URL_LINUX_ARM64"
                sha256 "SHA_LINUX_ARM64"
              end
              on_intel do
                url "URL_LINUX_AMD64"
                sha256 "SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "wpexportjson"
              bin.install "wpxmlrpc"
              bin.install "wpmcp"
              man1.install "man/wpexportjson.1" if File.exist? "man/wpexportjson.1"
            end

            test do
              system "#{bin}/wpexportjson", "--help"
              system "#{bin}/wpxmlrpc", "--help"
            end
          end
          FORMULA_EOF

          BASE_URL="https://github.com/tradik/wpexporter/releases/download/${VERSION}"

          sed -i "s|VERSION_PLACEHOLDER|${VERSION_NUM}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_DARWIN_ARM64|${BASE_URL}/wpexportjson-${VERSION}-darwin-arm64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_DARWIN_AMD64|${BASE_URL}/wpexportjson-${VERSION}-darwin-amd64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_LINUX_ARM64|${BASE_URL}/wpexportjson-${VERSION}-linux-arm64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|URL_LINUX_AMD64|${BASE_URL}/wpexportjson-${VERSION}-linux-amd64.tar.gz|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_DARWIN_ARM64|${{ steps.sha.outputs.sha_DARWIN_ARM64 }}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_DARWIN_AMD64|${{ steps.sha.outputs.sha_DARWIN_AMD64 }}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_LINUX_ARM64|${{ steps.sha.outputs.sha_LINUX_ARM64 }}|g" homebrew-tap/Formula/wpexporter.rb
          sed -i "s|SHA_LINUX_AMD64|${{ steps.sha.outputs.sha_LINUX_AMD64 }}|g" homebrew-tap/Formula/wpexporter.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/wpexporter.rb

      - name: Push updated formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wpexporter.rb
          git diff --cached --quiet && exit 0
          git commit -m "feat: Update wpexporter to ${{ steps.version.outputs.version }}"
          git push

  snap:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update snap version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION_NUM="${VERSION#v}"
          sed -i "s/^version:.*/version: \"${VERSION_NUM}\"/" snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
