# Publishes the wpexporter documentation site (docs/ rendered with the bundled
# ssgtheme, configured by ./docs-site.yaml) to Cloudflare Pages at
# https://wpexporter.tradik.com/.
#
# Only documentation, site template, assets and this workflow trigger it. Nothing
# here compiles Go, so a change under cmd/ or internal/ deliberately does NOT
# rebuild the site — and, symmetrically, ci.yml ignores the paths listed below so
# a documentation edit never runs tests, lint, gosec, the release or the Docker
# push.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - "Cloudflare Pages: Edit" permission. Attaching the
#                            custom domain additionally needs Zone:DNS:Edit on the
#                            domain's zone; without it that one step warns and the
#                            deployment still publishes.
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account that owns the project
#
# Optional repository variables:
#   CLOUDFLARE_PAGES_PROJECT - Pages project name (default: wpexporter-docs)
#   DOCS_DOMAIN              - custom domain (default: wpexporter.tradik.com)
#
# Both the project and the custom domain are created on the first run and left
# alone afterwards, so there is nothing to click in the dashboard.

name: Docs Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "templates/ssgtheme/**"
      - "assets/**"
      - "docs-site.yaml"
      - ".github/workflows/docs-site.yml"
  # A pull request builds the site but does not deploy it: a dead link or an
  # unrenderable shortcode in a new guide is caught in review, not by a failed
  # production run after the merge.
  pull_request:
    paths:
      - "docs/**"
      - "templates/ssgtheme/**"
      - "assets/**"
      - "docs-site.yaml"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Cloudflare Pages project name"
        required: false
        type: string

# One deployment at a time: Pages serialises them anyway, and a queued run would
# only publish an older tree.
concurrency:
  group: docs-site-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep JavaScript actions on Node 24 even where the runner still defaults to an
  # older one.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy
    # Pull requests reach the build step and stop there; every step that touches
    # Cloudflare is gated on the event.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: ${{ inputs.project || vars.CLOUDFLARE_PAGES_PROJECT || 'wpexporter-docs' }}
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN || 'wpexporter.tradik.com' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The header version chip is a plain string in docs-site.yaml so the site
      # builds identically from a checkout. VERSION is the single source of truth,
      # so re-assert it here rather than trusting the two to be edited together.
      - name: Sync the version chip from VERSION
        run: |
          set -euo pipefail
          RAW=$(tr -d '[:space:]' < VERSION)
          sed -i "s|^  version: .*|  version: \"${RAW}\"|" docs-site.yaml
          grep -n '^  version:' docs-site.yaml

      # Builds only. Deployment is a separate invocation below so a pull request
      # can run this step and nothing else.
      - name: Build the site (pull request)
        if: github.event_name == 'pull_request'
        uses: spagu/ssg@a1bed38991197c018563d1099fc310edeca65f6a # v1 (1.8.32)
        with:
          config: docs-site.yaml
          # The action forwards its own directory defaults, so the config's
          # output_dir would otherwise be overridden with ./output.
          output-dir: .site
          clean: "true"

      # Idempotent: creates the Pages project on the first run, does nothing on
      # every run after. SSG uploads deployments but does not create projects, and
      # a missing project fails the upload with a bare 404.
      - name: Ensure the Pages project exists
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          projects="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${projects}/${PROJECT}")
          case "$code" in
            200) echo "Pages project ${PROJECT} already exists." ; exit 0 ;;
            404) ;;
            *) echo "::error::Cloudflare returned ${code} while looking up ${PROJECT}"
               cat /tmp/project.json ; exit 1 ;;
          esac
          echo "Creating Pages project ${PROJECT}…"
          curl -sS --fail-with-body -X POST "$projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${PROJECT}\",\"production_branch\":\"main\"}" >/dev/null
          echo "Created ${PROJECT}."

      # One invocation: SSG deploys only after a successful generate, and
      # shortcode_errors: strict (set in docs-site.yaml) aborts before that point,
      # so nothing half-built reaches the CDN.
      - name: Build and deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: spagu/ssg@a1bed38991197c018563d1099fc310edeca65f6a # v1 (1.8.32)
        with:
          config: docs-site.yaml
          output-dir: .site
          clean: "true"
          deploy: cloudflare
          deploy-project: ${{ env.PROJECT }}
          deploy-branch: main

      # Also idempotent. A failure here must not fail the run: the deployment is
      # already live on <project>.pages.dev, and the usual cause is a token without
      # Zone:DNS:Edit, which is a permissions decision, not a build problem.
      - name: Attach the custom domain
        id: domain
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          domains="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/domains"
          if curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$domains" \
             | grep -q "\"name\":\"${DOCS_DOMAIN}\""; then
            echo "${DOCS_DOMAIN} is already attached to ${PROJECT}."
            exit 0
          fi
          echo "Attaching ${DOCS_DOMAIN} to ${PROJECT}…"
          curl -sS --fail-with-body -X POST "$domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${DOCS_DOMAIN}\"}" >/dev/null
          echo "Attached. DNS and the certificate are provisioned by Cloudflare."

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Documentation site deployed"
            echo
            echo "- Project: \`${PROJECT}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Preview: https://${PROJECT}.pages.dev/"
            if [[ "${DOMAIN_OUTCOME}" == "success" ]]; then
              echo "- Site: https://${DOCS_DOMAIN}/"
            else
              echo "- ⚠️ Custom domain \`${DOCS_DOMAIN}\` was not attached — see the"
              echo "  \"Attach the custom domain\" step. The token likely lacks"
              echo "  Zone:DNS:Edit; attach it once in the dashboard instead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DOMAIN_OUTCOME: ${{ steps.domain.outcome }}
