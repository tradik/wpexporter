# Documentation site for wpexporter — https://wpexporter.tradik.com/
#
# Built with SSG (https://ssg.tradik.com/) and the bundled ssgtheme in
# templates/ssgtheme, which is the same theme, tokens and design system the SSG
# site itself runs on.
#
# Deliberately NOT named .ssg.yaml: that filename is auto-detected by every ssg
# invocation in this directory, so a config describing THIS site would hijack any
# other build run from a checkout — including an `-f ssg` export a contributor is
# testing. Always pass it explicitly:
#
#   make site        # build into .site/
#   make site-serve  # build and serve on http://127.0.0.1:8888
#
# There is no content/<source>/ tree: the pages ARE this repository's docs/
# Markdown, pulled in through content_sources. Editing a guide and pushing it is
# the whole publishing workflow — nothing is copied or generated into a second
# location that could drift.
template: ssgtheme
domain: wpexporter.tradik.com
output_dir: .site

content_sources:
  - path: docs
    type: page
    category: Documentation

# Guides cross-link each other as ARCHITECTURE.md, which only resolves in a
# repository view; rewrite_md_links turns those into the built page URLs (anchors
# included), and strip_md_link_text drops the ".md" from the visible link text
# ("see ARCHITECTURE" instead of "see ARCHITECTURE.md").
rewrite_md_links: true
strip_md_link_text: true

# The guides also link to repository files the site never publishes. Point those
# at GitHub instead of 404ing. CONTRIBUTING.md does not exist yet, so its link
# goes to the README section that currently carries those instructions.
link_rewrites:
  "../README.md": "https://github.com/tradik/wpexporter/blob/main/README.md"
  "../CONTRIBUTING.md": "https://github.com/tradik/wpexporter#contributing"
  "../CHANGELOG.md": "https://github.com/tradik/wpexporter/blob/main/CHANGELOG.md"
  "../man/": "https://github.com/tradik/wpexporter/tree/main/man/"
  "../config.example.yaml": "https://github.com/tradik/wpexporter/blob/main/config.example.yaml"
check_links: warn
shortcode_errors: strict

# docs/*.md have no "## Excerpt" section; derive one from the opening paragraph so
# cards and meta descriptions are not blank.
auto_excerpt: true

# Nine guide cards on the home page — three rows of three — before the
# "20 guides in total" line. The default is six, which showed a third of the set.
home_pages_limit: 9

pretty_html: true
sitemap_off: false
robots_off: false
search_index: true

# Markdown for agents: publish index.md + page.md next to every page, a
# text/markdown <head> alternate, and a root llms.txt. Agents and LLMs that read
# Markdown get the authored source directly — fitting for a tool that ships its
# own MCP server.
markdown_publish: true

# Explicit crawler policy. The AI crawlers are welcomed because the published
# Markdown/llms.txt above is written precisely for them; Google reads the standard
# HTML regardless.
robots_rules:
  - user_agent: "*"
    allow: ["/"]
  - user_agent: GPTBot
    allow: ["/"]
  - user_agent: OAI-SearchBot
    allow: ["/"]
  - user_agent: Google-Extended
    allow: ["/"]

# seo injects JSON-LD (WebPage / WebSite + BreadcrumbList) alongside the theme's
# own OpenGraph; schema adds a site-wide publisher to every page.
seo: true
schema:
  publisher:
    "@type": Organization
    name: wpexporter
    url: https://wpexporter.tradik.com/

# Emit routes.json so the route contract ships with the site.
route_manifest: true

# Code blocks: Chroma syntax highlighting with line numbers, and Mermaid diagrams
# rendered from ```mermaid fences (docs/ARCHITECTURE.md is nothing but diagrams;
# the runtime is injected only on pages that use one).
highlight: true
highlight_style: github-dark
highlight_line_numbers: true
mermaid: true
# Diagrams are transparent by default, so on the dark code chrome they are hard to
# read; box each one on a white panel with the light "neutral" theme.
mermaid_theme: neutral
mermaid_background: "#ffffff"

# Content-address CSS/JS names, so a changed asset arrives under a new URL.
#
# Without this the generated _headers still marks /css/* and /js/* immutable for a
# year, and `immutable` tells the browser not even to revalidate — so a stylesheet
# edit stays invisible to anyone who visited before. A content hash in the name is
# the way out: the URL changes, so the stale copy is simply not requested.
fingerprint: true

headers:
  # `immutable` is deliberately NOT used, even though the names now carry a
  # content hash. _headers matches by path pattern, not by what was actually
  # served, so the rule also lands on a 404 fallback for a path under /css/. Ask
  # for an asset in the window before a deploy has propagated and the edge pins
  # that HTML page under the asset URL — for a year, unrevalidatable. A day-long
  # cache keeps virtually all the benefit while leaving any poisoned entry to
  # expire on its own. must-revalidate is the part that bites: Cloudflare Pages
  # rewrites max-age on static assets but preserves the directives.
  /css/*:
    Cache-Control: "public, max-age=86400, must-revalidate"
  /js/*:
    Cache-Control: "public, max-age=86400, must-revalidate"

variables:
  # Brand mark and hero photograph, both resolved inside assets/ and resized at
  # build time. Uncomment each once the file is in place — see assets/README.md
  # for what the theme expects. Unset means a plain hero and a wordmark-only
  # header, which is why the site builds today without either.
  # logo: logo.png
  # hero_image: hero.jpg

  github_repo: tradik/wpexporter # enables the header star count
  repository_url: https://github.com/tradik/wpexporter

  # Header version chip. Committed as the current release; the Docs Site workflow
  # rewrites it from the VERSION file before building, so a release bump reaches
  # the site even when this line lags behind.
  version: "1.8.5"

  # No `gtag` and no `gtm_id`: this site ships no analytics, so it also needs no
  # consent banner. Add either variable (and cookie_consent alongside it) if that
  # ever changes — the theme renders both Consent-Mode-v2-aware.

  # Horizontal "exports natively to" strip on the home page.
  #
  # The marks are the official monochrome brand paths from Simple Icons
  # (github.com/simple-icons, CC0-1.0). They are data, not drawings: reproducing a
  # company's mark from memory gets the proportions wrong, which misrepresents the
  # brand worse than showing no mark at all. Each brand remains its owner's
  # trademark; naming them to say "this exports there" is nominative use. Weebly
  # has no Simple Icons entry, so it rides as a name without a mark rather than as
  # an invented one. All Simple Icons paths use a 24x24 viewBox.
  marquee:
    title: "Exports natively to"
