  # Sidebar order on every guide: the path a reader actually takes, rather than
  # the alphabetical order .Site.Pages arrives in. A guide missing from this list
  # still appears, after the ordered ones.
  docs_nav_order:
    - install          # first thing anyone does
    - quickstart       # then run something
    - cli              # then tune it
    - formats          # then pick a destination
    - formats-ecommerce
    - formats-cms
    - formats-builders
    - ssg-format
    - media            # then deal with the files
    - seo
    - markdown
    - page-builders
    - menus            # the parts a public API hides
    - comments
    - accessibility
    - mcp              # driving it from an agent
    - xmlrpc_manual    # the other protocol
    - architecture     # how it works inside
    - development
    - github-actions-versions

  # Header navigation: a fixed, hand-picked set. The footer carries the full guide
  # directory, so this stays short whatever docs/ grows into.
  nav:
    - label: Install
      url: /install/
    - label: Quick start
      url: /quickstart/
    - label: CLI
      url: /cli/
    - label: Formats
      url: /formats/
    - label: Docs
      url: /#documentation
    - label: GitHub
      url: https://github.com/tradik/wpexporter
