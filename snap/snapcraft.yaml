name: wpexporter
base: core22
version: "1.8.19"
title: wpexporter
summary: Export WordPress content to JSON, Markdown, Shopify, and 14+ formats
description: |
  wpexporter is a suite of CLI tools for exporting WordPress content:

  - wpexportjson: REST API-based exporter with brute force discovery
  - wpxmlrpc: XML-RPC based exporter for authenticated access
  - wpmcp: MCP server for AI assistant integration

  Supports 14+ export formats including JSON, Markdown, Shopify CSV,
  Magento, WooCommerce, Drupal, Ghost, Strapi, Contentful, and more.

  Features: persistent caching, SEO metadata extraction, media download,
  HTML preservation, rate limiting, and resume/checkpoint support.
contact: https://github.com/tradik/wpexporter/issues
issues: https://github.com/tradik/wpexporter/issues
source-code: https://github.com/tradik/wpexporter
website: https://github.com/tradik/wpexporter

grade: stable
confinement: strict
license: MIT

architectures:
  - build-on: amd64
  - build-on: arm64

parts:
  wpexporter:
    # plugin: nil rather than the go plugin, and the toolchain fetched below
    # rather than from the go snap.
    #
    # go.mod requires a Go newer than any channel of the go snap ships, which
    # is the ordinary state of affairs and was first met in 1.8.5. Left to
    # itself Go fetches the toolchain it needs, and the line it prints while
    # doing so lands inside the version string the go plugin parses:
    #   invalid go compiler version 'go: downloading go1.27.0 (linux/arm64)'
    # which failed the arm64 build of 1.8.5 before it started.
    #
    # Fetching the toolchain here, pinned by the checksum go.dev publishes
    # beside it, means the snap is built by exactly the compiler the release
    # notes claim, and cannot be quietly built by an older one.
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - curl
      - ca-certificates
    build-environment:
      - CGO_ENABLED: "0"
      - GOFLAGS: "-mod=mod"
      # Nothing may reach for a different toolchain behind our back: the one
      # unpacked below is the one that builds, or the build fails saying so.
      - GOTOOLCHAIN: "local"
    override-build: |
      set -eu

      GO_VERSION=1.27.1
      GO_ARCH=$(dpkg --print-architecture)
      case "${GO_ARCH}" in
        amd64) GO_SHA256=63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445 ;;
        arm64) GO_SHA256=3450b45a3f9ee8568792736a5c5e70a1f2e9b36c35a8f74958c03e51d7d92bec ;;
        *) echo "no pinned Go toolchain for ${GO_ARCH}" >&2; exit 1 ;;
      esac

      GO_TARBALL="go${GO_VERSION}.linux-${GO_ARCH}.tar.gz"
      curl -fsSL --retry 3 --retry-delay 2 -o "${CRAFT_PART_BUILD}/${GO_TARBALL}" \
        "https://go.dev/dl/${GO_TARBALL}"
      echo "${GO_SHA256}  ${CRAFT_PART_BUILD}/${GO_TARBALL}" | sha256sum -c -

      rm -rf "${CRAFT_PART_BUILD}/toolchain"
      mkdir -p "${CRAFT_PART_BUILD}/toolchain"
      tar -C "${CRAFT_PART_BUILD}/toolchain" -xzf "${CRAFT_PART_BUILD}/${GO_TARBALL}"
      export PATH="${CRAFT_PART_BUILD}/toolchain/go/bin:${PATH}"
      go version

      # The VERSION file is the single source of truth; git describe would stamp
      # the previous tag plus a commit count, since the tag is created after build.
      VERSION=$(test -f VERSION && echo "v$(tr -d '[:space:]' < VERSION)" || git describe --tags --always --dirty 2>/dev/null || echo "v0.0.0")
      BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
      # Stamp internal/version, not main: the commands became thin wrappers in
      # 1.8.0 and no longer declare their own Version. The linker ignores -X for a
      # symbol that does not exist, silently and without an error, so the snap
      # shipped whatever default internal/version carried — 1.8.1's snap reported
      # itself as 1.8.0.
      VERSION_PKG="github.com/tradik/wpexporter/internal/version"
      LDFLAGS="-X ${VERSION_PKG}.Version=${VERSION} -X ${VERSION_PKG}.BuildTime=${BUILD_TIME} -X ${VERSION_PKG}.GitCommit=${GIT_COMMIT} -s -w"

      go build -ldflags "${LDFLAGS}" -o ${CRAFT_PART_INSTALL}/bin/wpexportjson ./cmd/wpexportjson
      go build -ldflags "${LDFLAGS}" -o ${CRAFT_PART_INSTALL}/bin/wpxmlrpc ./cmd/wpxmlrpc
      go build -ldflags "${LDFLAGS}" -o ${CRAFT_PART_INSTALL}/bin/wpmcp ./cmd/wpmcp
      go build -ldflags "${LDFLAGS}" -o ${CRAFT_PART_INSTALL}/bin/wpexporter ./cmd/wpexporter

      mkdir -p ${CRAFT_PART_INSTALL}/share/man/man1
      cp man/wpexportjson.1 ${CRAFT_PART_INSTALL}/share/man/man1/ 2>/dev/null || true

apps:
  wpexporter:
    command: bin/wpexporter
    plugs:
      - network
      - home
      - removable-media
  wpexportjson:
    command: bin/wpexportjson
    plugs:
      - network
      - home
      - removable-media
  wpxmlrpc:
    command: bin/wpxmlrpc
    plugs:
      - network
      - home
      - removable-media
  wpmcp:
    command: bin/wpmcp
    plugs:
      - network
      - home
