# golangci-lint configuration file
# https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  disable:
    - depguard
    - dupl
  enable:
    - dogsled
    - errcheck
    - exhaustive
    - goconst
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 85
    goconst:
      min-len: 6
      min-occurrences: 25
    misspell:
      locale: US
    lll:
      line-length: 150
    nakedret:
      max-func-lines: 30
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - lll
          - goconst
          - govet
          - ineffassign
      - text: "weak cryptographic primitive"
        linters:
          - gosec
      - text: "shadow: declaration of \"err\""
        linters:
          - govet
      - text: "G304"
        path: internal/export/
        linters:
          - gosec
      - text: "always receives"
        path: internal/export/contentful_exporter.go
        linters:
          - unparam

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tradik/wpexporter
